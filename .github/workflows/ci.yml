
name: FiberLab CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Run Ruff lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  automated-tests:
    name: Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

  package:
    name: Build downloadable ZIP
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - automated-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create source package
        run: |
          mkdir -p dist
          zip -r "dist/FiberLab-${GITHUB_SHA::7}.zip" . \
            -x ".git/*" ".venv/*" "venv/*" "__pycache__/*" \
               ".pytest_cache/*" ".ruff_cache/*" "dist/*" "*.pyc"

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: FiberLab-${{ github.sha }}
          path: dist/FiberLab-*.zip
          if-no-files-found: error
          retention-days: 30
